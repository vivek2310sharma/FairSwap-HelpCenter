name: Help Centre quality
on:
  push:
    branches: [docs/help-center-v1-blueprint, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Diagnose formatter differences
        run: |
          pnpm exec prettier src/components/pages.tsx | diff -u src/components/pages.tsx - || true
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm test
      - run: pnpm build
        env:
          VERCEL_ENV: preview
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
        env:
          VERCEL_ENV: preview
      - run: pnpm build
        env:
          VERCEL: "1"
          VERCEL_ENV: production
      - run: pnpm test:production
